<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✅ Aktivitäten – Island 2026</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Confirmed booking card */
  .activity-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.1rem 1.2rem;
    margin-bottom: .85rem;
  }
  .date-head {
    display:flex; align-items:baseline; gap:.6rem; margin:1.6rem 0 .7rem;
  }
  .date-head:first-of-type { margin-top:.4rem; }
  .date-head .day {
    font-family:'Playfair Display',serif; font-size:1.05rem; font-weight:600;
  }
  .date-head .line { flex:1; height:1px; background:var(--border); }
  .booking-time { font-size:.8rem; color:var(--ice); font-weight:600; margin-bottom:.3rem; }
  .booking-time .soft { color:var(--muted); font-weight:400; }
  .booking-name { font-weight:600; font-size:.95rem; margin-bottom:.55rem; }
  .booking-meet {
    display:flex; gap:.4rem; align-items:flex-start; margin-top:.55rem;
    font-size:.76rem; color:var(--muted); line-height:1.4;
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar-logo" href="index.html">Island Sommer 2026</a>
  <nav class="topbar-nav" id="nav-container"></nav>
  <span class="topbar-badge" id="user-badge">🇮🇸</span>
</header>

<main style="max-width:680px;margin:0 auto;padding:1rem 1rem 1rem;padding-bottom:calc(var(--nav-h) + 1.5rem + env(safe-area-inset-bottom))">

  <div style="text-align:center;margin:.4rem 0 1.2rem">
    <h2 style="font-family:'Playfair Display',serif">✅ Gebuchte Aktivitäten</h2>
    <p style="font-size:.82rem;color:var(--muted);margin-top:.3rem">Bestätigte Buchungen, nach Datum sortiert.</p>
  </div>

  <div id="bookings-container"></div>

</main>

<script src="config.js"></script>
<script src="db.js"></script>
<script>
document.getElementById('nav-container').innerHTML = navHTML('aktivitaeten');

// Confirmed bookings only, in strict date order.
const BOOKINGS = [
  { date:'Donnerstag, 16. Juli', name:'Vulkan-Quad / ATV-Tour', time:'12:00–13:00',
    group:false, who:'👤 Nur 5', people:'Adrian, Mauro, Lorean, Claudio, Peter', lang:false, price:'610 CHF',
    meet:'Volcano ATV, Strandvegur 65, Vestmannaeyjar' },

  { date:'Donnerstag, 16. Juli', name:'Papageientaucher- & Vulkan-Tour', time:'14:30–16:30',
    group:true, who:'👥 Ganze Gruppe (9)', lang:false, price:'ISK 99.000',
    meet:'Eyjatours, Básaskersbryggja 8, Vestmannaeyjar' },

  { date:'Sonntag, 19. Juli', name:'Laugarvatn Fontana – Geothermales Brotbacken', time:'10:15', note:'da sein 10:05',
    group:true, who:'👥 Ganze Gruppe (9)', lang:true, price:'195 CHF',
    meet:'Empfang Laugarvatn Fontana, Hverabraut, Laugarvatn' },

  { date:'Dienstag, 21. Juli', name:'Amphibienboot-Fähre Jökulsárlón', time:'09:00',
    group:true, who:'👥 Ganze Gruppe (9)', lang:false, price:'ISK 63.900',
    meet:null },

  { date:'Freitag, 24. Juli', name:'Angeltour', time:'2 Std.', note:'Startzeit folgt',
    group:false, who:'👤 Nur 3', people:'Mauro, Claudio, Lorean', lang:false, price:'128 CHF p. P.',
    meet:null },

  { date:'Mittwoch, 29. Juli', name:'Þórsmörk Super-Jeep (Midgard)', time:'09:00–16:00',
    group:false, who:'👤 Nur 6', lang:false, price:'1455 CHF',
    meet:null },
];

const container = document.getElementById('bookings-container');
let lastDate = null;
BOOKINGS.forEach(b => {
  if (b.date !== lastDate) {
    const head = document.createElement('div');
    head.className = 'date-head';
    head.innerHTML = `<span class="day">${b.date}</span><span class="line"></span>`;
    container.appendChild(head);
    lastDate = b.date;
  }
  const whoClass = b.group ? 'tag-green' : 'tag-gray';
  const card = document.createElement('div');
  card.className = 'activity-card';
  card.innerHTML = `
    <div class="booking-time">⏱ ${b.time}${b.note ? ` <span class="soft">(${b.note})</span>` : ''}</div>
    <div class="booking-name">${b.name}</div>
    <div style="display:flex;flex-wrap:wrap;gap:.3rem">
      <span class="tag ${whoClass}">${b.who}</span>
      ${b.lang ? '<span class="tag tag-gray">🇬🇧 Englisch</span>' : ''}
      ${b.price ? `<span class="tag tag-gray">${b.price}</span>` : ''}
    </div>
    ${b.people ? `<div class="booking-meet"><span>👤</span><span>${b.people}</span></div>` : ''}
    ${b.meet ? `<div class="booking-meet"><span>📍</span><span>${b.meet}</span></div>` : ''}`;
  container.appendChild(card);
});
</script>
</body>
</html>
